<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>

body{
    font-family:Segoe UI;
    margin:0;
    background:#0f172a;
    color:white;
}

.header{
    padding:25px;
    background:#111827;
    text-align:center;
}

.cards{
    display:flex;
    gap:20px;
    padding:40px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    width:250px;
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

.value{
    font-size:32px;
    color:#38bdf8;
}

h1{
    margin:0;
}
</style>
</head>

<body>

<div class="header">
    <h1>Application Dashboard</h1>
</div>

<div class="cards">

<div class="card">
<h3>Status</h3>
<div class="value">ONLINE</div>
</div>

<div class="card">
<h3>Server</h3>
<div class="value">IIS</div>
</div>

<div class="card">
<h3>Framework</h3>
<div class="value">.NET 10</div>
</div>

</div>

</body>
</html>
